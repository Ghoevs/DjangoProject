{% extends 'dogs/index.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Смена пароля</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сменить пароль</button>
    </form>
    <a href="{% url 'users:profile' %}" class="btn btn-secondary mt-2">Назад в профиль</a>
</div>
{% endblock %}
