{% extends 'dogs/index.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Пользователи</h2>
    <div class="row">
        {% for user in users %}
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ user.username }}</h5>
                        <p class="card-text">{{ user.email }}</p>
                        <a href="{% url 'users:user_detail' user.id %}" class="btn btn-primary">Подробнее</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Пользователей нет.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
