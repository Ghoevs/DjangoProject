{% extends 'dogs/index.html' %}
{% block content %}
<h2>{{ action }} собаку</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'dogs:dogs_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
