{% extends 'dogs/index.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Удалить отзыв?</h2>
    <p>Вы уверены, что хотите удалить этот отзыв?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'dogs:dog_detail' review.dog.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
