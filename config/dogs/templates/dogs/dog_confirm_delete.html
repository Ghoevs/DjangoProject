{% extends 'dogs/index.html' %}
{% block content %}
<h2>Удалить собаку?</h2>
<p>Вы уверены, что хотите удалить <strong>{{ dog.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'dogs:dogs_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
