{% extends 'dogs/index.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Добавить родословную для {{ dog.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'dogs:dog_detail' dog.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
